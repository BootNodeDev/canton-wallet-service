# wallet-sdk 1.3.1 is pinned exact but asks for `^1.x` on every `core-*` package, so a
# reinstall floats them. Amulet preapproval broke that way: core-amulet-service walked to
# 1.10.1 and made its scan client private. Every core package is pinned here at the version
# this service is verified against; bump them deliberately, then re-run the local gates.
overrides:
  '@canton-network/core-acs-reader': 1.12.0
  '@canton-network/core-amulet-service': 1.10.1
  '@canton-network/core-asyncapi-client': 1.10.1
  '@canton-network/core-ledger-client': 1.10.1
  '@canton-network/core-ledger-client-types': 1.10.1
  '@canton-network/core-ledger-proto': 1.9.1
  '@canton-network/core-provider-dapp': 1.10.1
  '@canton-network/core-provider-ledger': 1.10.1
  '@canton-network/core-rpc-errors': 1.9.1
  '@canton-network/core-rpc-transport': 1.10.1
  '@canton-network/core-signing-lib': 1.10.1
  '@canton-network/core-splice-client': 1.10.1
  '@canton-network/core-splice-provider': 1.10.1
  '@canton-network/core-token-standard': 1.10.1
  '@canton-network/core-token-standard-service': 1.10.1
  '@canton-network/core-tx-parser': 1.10.1
  '@canton-network/core-tx-visualizer': 1.9.1
  '@canton-network/core-types': 1.10.1
  '@canton-network/core-wallet-auth': 1.10.1
  '@canton-network/core-wallet-dapp-remote-rpc-client': 1.10.1
  '@canton-network/core-wallet-dapp-rpc-client': 1.10.1

# Dependencies allowed to run install scripts (pnpm blocks them by default).
# esbuild backs tsx; protobufjs arrives with the SDK's grpc transport.
allowBuilds:
  esbuild: true
  protobufjs: true
